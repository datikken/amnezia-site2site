<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <g fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms -->
    <path d="M32 32 L17 17"/>
    <path d="M32 32 L47 17"/>
    <path d="M32 32 L17 47"/>
    <path d="M32 32 L47 47"/>
  </g>

  <!-- propellers -->
  <g fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.8">
    <circle cx="15" cy="15" r="8.5"/>
    <circle cx="49" cy="15" r="8.5"/>
    <circle cx="15" cy="49" r="8.5"/>
    <circle cx="49" cy="49" r="8.5"/>
  </g>

  <!-- propeller motion marks -->
  <g stroke="#34d399" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M9 11 a7 7 0 0 1 7 -2"/>
    <path d="M55 11 a7 7 0 0 0 -7 -2"/>
    <path d="M9 53 a7 7 0 0 0 7 2"/>
    <path d="M55 53 a7 7 0 0 1 -7 2"/>
  </g>

  <!-- central body -->
  <rect x="25" y="25" width="14" height="14" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="2.4"/>

  <!-- camera / fpv lens -->
  <circle cx="32" cy="29.5" r="2.4" fill="#67e8f9"/>
  <circle cx="32" cy="29.5" r="1" fill="#0f172a"/>
</svg>
